<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" role="img" aria-label="Campus Quest registration banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14213D"/>
      <stop offset="1" stop-color="#1F3A5F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>

  <!-- Map route (dashed quest path) -->
  <path d="M780 400 C 900 320, 960 440, 1080 340 S 1260 250, 1340 160" fill="none" stroke="#FCA311" stroke-width="5" stroke-dasharray="4 16" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Waypoints -->
  <circle cx="780" cy="400" r="12" fill="#2EC4B6"/>
  <circle cx="1080" cy="340" r="12" fill="#2EC4B6"/>
  <circle cx="1340" cy="160" r="12" fill="#2EC4B6"/>

  <!-- Map pin (destination) -->
  <g transform="translate(1340 160)">
    <path d="M0 -90 C -42 -90 -66 -58 -66 -28 C -66 18 0 70 0 70 C 0 70 66 18 66 -28 C 66 -58 42 -90 0 -90 Z" fill="#FCA311"/>
    <circle cx="0" cy="-28" r="26" fill="#14213D"/>
    <path d="M0 -50 L7 -34 L24 -32 L11 -21 L15 -4 L0 -13 L-15 -4 L-11 -21 L-24 -32 L-7 -34 Z" fill="#FCA311"/>
  </g>

  <!-- Text -->
  <g font-family="'Trebuchet MS', 'Segoe UI', Arial, sans-serif">
    <text x="90" y="150" font-size="30" font-weight="600" fill="#2EC4B6">Registration is open</text>
    <text x="86" y="270" font-size="124" font-weight="800" fill="#FFFFFF" letter-spacing="-2">Campus Quest</text>
    <text x="90" y="330" font-size="34" fill="#E5E5E5">Explore. Solve. Win. Join the team challenge across campus.</text>
  </g>
</svg>
